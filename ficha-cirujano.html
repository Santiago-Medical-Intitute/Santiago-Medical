<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha del Cirujano · SMI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--crimson:#CD1D52;--bright:#E33C3B;--deep:#B22030;--ink:#1C1719;--muted:#857479;--faint:#A99CA0;
  --bg:#FAF7F6;--card:#FFFFFF;--line:#ECE0E2;--tint:#F7F0F1;--pos:#1f8a52;--neg:#C1453A;--warn:#B7791F;
  --fOp:#22A44B;--fPe:#1B75BB;--fAb:#F5A623;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:.1em 0}
h2{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:16px}
select,input{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--deep);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
#login{max-width:340px;margin:70px auto;text-align:center}
#app{display:none}
.loginTitle{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;color:var(--ink);margin:0 0 2px}
.g{color:var(--muted);font-size:14px;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.who{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.tabs{display:flex;gap:6px;margin-top:20px;border-bottom:2px solid var(--line)}
.tab{padding:10px 18px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--deep);border-bottom-color:var(--deep)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:center;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--tint)}
td:first-child,th:first-child{text-align:left;font-weight:600}
.wx{overflow-x:auto}
.cxf{font-size:10.5px;color:var(--faint);font-weight:400}
.cxtr{font-size:9px;color:var(--ink);vertical-align:1px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--deep)}
.rec{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.rec:first-child{border-top:0}
.rec .ic{font-size:16px;line-height:1.2}
.big-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.eff{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.eff .b{background:var(--tint);border-radius:10px;padding:12px 14px}
.hidden{display:none}
.funnel{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 8px;font-size:12.5px;font-weight:700;color:#fff}
.funnel>div{display:flex;align-items:center;justify-content:center;min-width:22px}
.fleg{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.fleg .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mp{color:var(--muted);font-size:13px}
.hh h2{margin-bottom:2px}
#printHead{display:none}
@media print{
  body{background:#fff}
  .wrap{max-width:100%;padding:0}
  #login,#selCard,.top,.tabs,#paneSMI,#kpis,#vacio,.noprint{display:none !important}
  #printHead{display:block !important;margin-bottom:6px;border-bottom:2px solid var(--deep);padding-bottom:8px}
  #printHead h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px}
  #paneCir,#paneCir.hidden{display:block !important}
  #paneCir .card{margin-top:12px;break-inside:avoid;border-color:#ddd}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1 class="loginTitle">Ficha del Cirujano</h1>
    <p class="g">Santiago Medical Institute</p>
    <input id="clave" type="password" placeholder="Clave de acceso" autocomplete="current-password" style="text-align:left">
    <button class="btn" id="entrar" style="width:100%">Entrar</button>
    <p id="loginMsg" class="sub" style="color:var(--neg);margin-top:10px"></p>
  </div>

  <div id="app">
    <div class="top">
      <div>
        <h1 style="color:var(--deep)">Ficha del Cirujano</h1>
        <div class="sub">Datos reales del OR System · totales del cirujano</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <button class="btn noprint hidden" id="btnPdf" style="padding:9px 14px;font-size:13px">⬇ Descargar PDF</button>
        <div class="who">Sesión: <strong id="whoTxt" style="color:var(--ink)">—</strong></div>
      </div>
    </div>

    <div id="printHead">
      <h1 id="phName" style="color:var(--deep);margin:0">—</h1>
      <div class="sub" id="phMeta">Santiago Medical Institute</div>
    </div>

    <div class="card" id="selCard">
      <label class="sub" style="font-weight:600">Seleccione un cirujano</label>
      <select id="selCir" style="margin-top:6px"></select>
    </div>

    <div id="cont" class="hidden">
      <div class="kpis" id="kpis"></div>
      <div class="tabs">
        <div class="tab on" data-t="smi">👁 Con ojos de SMI</div>
        <div class="tab" data-t="cir">🩺 Ojos del cirujano</div>
      </div>
      <div id="paneSMI"></div>
      <div id="paneCir" class="hidden"></div>
    </div>
    <div id="vacio" class="mp" style="margin-top:20px"></div>
  </div>
</div>

<script>
const SUPA_URL='https://rhpguniznuhljiigwetq.supabase.co';
const SUPA_KEY='sb_publishable_lVaI9a2wWFa0PSL3edPiRA_cVMlXDwG';
let CLAVE='',SESION='',LISTA=[];
const $=id=>document.getElementById(id);
async function rpc(fn,body){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const t=await r.text(); if(!r.ok) throw new Error(t||('HTTP '+r.status));
  return t?JSON.parse(t):null;
}
const clp=n=>'$'+Math.round(+n||0).toLocaleString('es-CL');
const clpK=n=>{n=+n||0; return n>=1e6?('$'+(n/1e6).toFixed(1)+'M'):clp(n);};
const h1dec=m=>((+m||0)/60).toFixed(1);
function mKey(d){ if(!d) return null; const s=String(d); const dt=new Date(s.length<=10?s+'T12:00:00':s); return isNaN(dt)?null:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function lastMonths(k){ const out=[],now=new Date(); for(let i=k-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); } return out; }
function mShort(k){ if(!k) return ''; const p=k.split('-'); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][(+p[1])-1]+' '+p[0].slice(2); }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function grupoCx(nom){
  const s=(nom||'').toLowerCase();
  if(/ginecomast/.test(s)) return 'Ginecomastia';
  if(/mama|mamari|mamopl|mastopex|pexia/.test(s)) return 'Cirugía de mama';
  if(/rino|septo|nariz/.test(s)) return 'Rinoplastia';
  if(/lipo/.test(s)) return 'Liposucción';
  if(/abdomin/.test(s)) return 'Abdominoplastia';
  if(/lift|ritidect/.test(s)) return 'Lifting';
  if(/blefar|parpad/.test(s)) return 'Blefaroplastia';
  if(/otoplast|oreja/.test(s)) return 'Otoplastia';
  if(/gluteo/.test(s)) return 'Glúteos';
  return nom||'—';
}

async function entrar(){
  const c=$('clave').value.trim(); if(!c) return;
  $('loginMsg').textContent='';
  try{
    const u=await rpc('smi_login',{p_clave:c});
    if(!u||!u.length){ $('loginMsg').textContent='Clave incorrecta o sin acceso.'; return; }
    CLAVE=c; SESION=u[0].nombre||'—';
    const r=await rpc('smi_ficha_cirujano',{p_clave:c});
    LISTA=(r&&r.lista)||[];
    $('login').style.display='none'; $('app').style.display='block';
    $('whoTxt').textContent=SESION;
    const sel=$('selCir');
    sel.innerHTML='<option value="">— elija —</option>'+LISTA.map(c=>'<option value="'+esc(c.nom)+'">'+esc(c.nom)+'  ('+c.op+' operadas · '+c.cot+' cotiz.)</option>').join('');
    sel.onchange=cargarCir;
  }catch(e){ $('loginMsg').textContent='Clave incorrecta o sin acceso.'; }
}
$('entrar').onclick=entrar;
$('clave').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });

async function cargarCir(){
  const nom=$('selCir').value;
  if(!nom){ $('cont').classList.add('hidden'); $('vacio').textContent=''; $('btnPdf').classList.add('hidden'); return; }
  $('vacio').textContent='Cargando…'; $('cont').classList.add('hidden');
  try{
    const r=await rpc('smi_ficha_cirujano',{p_clave:CLAVE,p_cirujano:nom});
    const datos=(r&&r.datos)||[];
    $('vacio').textContent='';
    if(!datos.length){ $('vacio').textContent='Sin datos para este cirujano.'; return; }
    render(nom,analizar(datos));
    $('cont').classList.remove('hidden');
  }catch(e){ $('vacio').textContent='Error: '+e.message; }
}

function analizar(datos){
  const months=lastMonths(6);
  const op=datos.filter(x=>x.estado==='operada');
  const montoOpTot=op.reduce((s,x)=>s+(+x.total||0),0);
  const pacKey=x=>(x.rut&&String(x.rut).trim())?('rut:'+String(x.rut).trim()):('folio:'+x.folio);

  // Conversion por PACIENTE (dedupe RUT). Cohorte = mes de su 1a cotizacion.
  const pac={};
  datos.forEach(x=>{ const k=pacKey(x); const p=pac[k]||(pac[k]={mesMin:null,op:false,perd:false,open:false});
    const mk=mKey(x.creada_en); if(mk&&(!p.mesMin||mk<p.mesMin))p.mesMin=mk;
    if(x.estado==='operada')p.op=true; else if(x.estado==='perdida')p.perd=true; else p.open=true; });
  // Conversión = operados / TODOS los RUT solicitantes del mes (incl. abiertos)
  const conv={}; months.forEach(k=>conv[k]={op:0,tot:0});
  Object.values(pac).forEach(p=>{ if(!conv[p.mesMin])return; conv[p.mesMin].tot++; if(p.op)conv[p.mesMin].op++; });
  const conv6=(()=>{let o=0,t=0;months.forEach(k=>{o+=conv[k].op;t+=conv[k].tot;});return t?Math.round(o/t*100):0;})();
  const pacTot=Object.keys(pac).length, pacOp=Object.values(pac).filter(p=>p.op).length;
  const pacPerd=Object.values(pac).filter(p=>!p.op&&p.perd&&!p.open).length;
  const pacRes=pacOp+pacPerd;
  const convAll=pacTot?Math.round(pacOp/pacTot*100):0; // sobre RUT solicitantes

  // Mix por categoria (volumen por folio + conversion por paciente dentro de la categoria)
  const mix={};
  datos.forEach(x=>{ const k=grupoCx(x.cirugia); const g=mix[k]||(mix[k]={op:0,montoOp:0,hCot:0,hReal:0,nDur:0,pac:{}});
    if(x.estado==='operada'){ g.op++; g.montoOp+=(+x.total||0); if(x.duracion_real_min!=null){g.hReal+=x.duracion_real_min;g.hCot+=(x.duracion_cotizada_min||0);g.nDur++;} }
    const pk=pacKey(x); const pp=g.pac[pk]||(g.pac[pk]={op:false,perd:false,open:false});
    if(x.estado==='operada')pp.op=true; else if(x.estado==='perdida')pp.perd=true; else pp.open=true; });

  // Eficiencia (operados con duracion)
  let hCotTot=0,hRealTot=0,nDur=0,nExc=0,deltaSum=0;
  op.forEach(x=>{ if(x.duracion_real_min!=null){ hRealTot+=x.duracion_real_min; hCotTot+=(x.duracion_cotizada_min||0); nDur++; const d=x.duracion_real_min-(x.duracion_cotizada_min||0); deltaSum+=d; if(d>0)nExc++; } });
  const deltaProm=nDur?Math.round(deltaSum/nDur):0;

  // Extras por categoria (frecuencia = % de casos operados que lo llevan)
  const ext={}; let extTot=0;
  op.forEach(x=>{ const cat=grupoCx(x.cirugia); const e=ext[cat]||(ext[cat]={n:0,items:{}}); e.n++;
    const vistos={};
    (x.extras||[]).forEach(xe=>{ if(xe.estado!=='validado')return; extTot+=(+xe.precio_total||0);
      const d=xe.descripcion||xe.tipo||'—'; const it=e.items[d]||(e.items[d]={casos:0,monto:0,qty:0});
      it.monto+=(+xe.precio_total||0); it.qty+=(+xe.cantidad||1); if(!vistos[d]){vistos[d]=1; it.casos++;} }); });
  const extPct=montoOpTot?Math.round(extTot/montoOpTot*100):0;

  return {datos,months,op,conv,conv6,pacTot,pacOp,pacPerd,pacRes,convAll,mix,hCotTot,hRealTot,nDur,nExc,deltaProm,extTot,extPct,ext,montoOpTot};
}

/* ---- matriz de conversión de una fila (por mes, con flecha) ---- */
function convRow(A){
  const bg=p=>p==null?'':'background:hsl('+Math.round(p*1.2)+',62%,90%)';
  const ps=A.months.map(k=>{ const c=A.conv[k]; return c.tot?{p:Math.round(c.op/c.tot*100),op:c.op,res:c.tot}:null; });
  let h='<div class="wx"><table><tr>';
  A.months.forEach(k=>h+='<th>'+mShort(k)+'</th>'); h+='<th>6 meses</th></tr><tr>';
  ps.forEach((cur,i)=>{ if(!cur){ h+='<td><span class="cxf">—</span></td>'; return; }
    let prev=null; for(let j=i-1;j>=0;j--){ if(ps[j]){prev=ps[j];break;} }
    let tr=''; if(prev){ if(cur.p>prev.p)tr=' <span class="cxtr">▲</span>'; else if(cur.p<prev.p)tr=' <span class="cxtr">▼</span>'; }
    h+='<td style="'+bg(cur.p)+'"><b>'+cur.p+'%</b>'+tr+'<div class="cxf">'+cur.op+'/'+cur.res+'</div></td>'; });
  h+='<td style="font-weight:700;'+bg(A.conv6)+'">'+A.conv6+'%</td></tr></table></div>';
  return h;
}

/* ---- mix de cirugías ---- */
function mixTable(A){
  const arr=Object.entries(A.mix).sort((a,b)=>b[1].op-a[1].op);
  let h='<div class="wx"><table><tr><th>Categoría</th><th>Operadas</th><th>Conv. pac.</th><th>Ticket prom.</th><th>Horas cot.→real</th></tr>';
  arr.forEach(([k,v],i)=>{
    let po=0,pr=0; Object.values(v.pac).forEach(p=>{ pr++; if(p.op)po++; });
    const cv=pr?Math.round(po/pr*100):null;
    const tk=v.op?clpK(v.montoOp/v.op):'—';
    const hc=v.nDur?(h1dec(v.hCot/v.nDur)+'→'+h1dec(v.hReal/v.nDur)+' h'):'—';
    h+='<tr><td>'+esc(k)+(i===0&&v.op>0?' <span class="chip">la que más hace</span>':'')+'</td><td class="num">'+v.op+'</td><td class="num">'+(cv==null?'—':cv+'%')+'</td><td class="num">'+tk+'</td><td class="num">'+hc+'</td></tr>'; });
  h+='</table></div>'; return h;
}

/* ---- extras habituales por cirugía ---- */
function extrasHab(A){
  const cats=Object.keys(A.ext); if(!cats.length) return '<div class="mp">Sin extras validados registrados.</div>';
  cats.sort((a,b)=>A.ext[b].n-A.ext[a].n);
  let h='';
  cats.forEach(cat=>{ const e=A.ext[cat];
    const items=Object.entries(e.items).map(([d,it])=>({d,freq:it.casos/e.n,casos:it.casos,qty:it.qty/it.casos,monto:it.monto/it.casos}))
      .sort((a,b)=>b.freq-a.freq).slice(0,8);
    h+='<div style="margin-bottom:12px"><div style="font-weight:700;margin-bottom:4px">'+esc(cat)+' <span class="mp" style="font-weight:400">· '+e.n+' cirugías</span></div>';
    h+='<div class="wx"><table><tr><th>Insumo / extra</th><th>Frecuencia</th><th>Cant. prom.</th><th>Monto prom.</th></tr>';
    items.forEach(it=>{ const pct=Math.round(it.freq*100);
      h+='<tr><td>'+esc(it.d)+(pct>=70?' <span class="chip">a la base</span>':'')+'</td><td class="num">'+pct+'% <span class="cxf">('+it.casos+'/'+e.n+')</span></td><td class="num">'+it.qty.toFixed(1)+'</td><td class="num">'+clp(it.monto)+'</td></tr>'; });
    h+='</table></div></div>';
  });
  return h;
}

/* ---- valor + recomendaciones (ojos de SMI) ---- */
function valorRec(A){
  const recs=[];
  if(A.deltaProm>15) recs.push(['⏱','Sus cirugías <b>exceden en promedio '+A.deltaProm+' min</b> lo cotizado ('+A.nExc+' de '+A.nDur+'). Conviene ajustar las horas cotizadas o revisar la planificación de pabellón.']);
  else if(A.deltaProm< -10) recs.push(['⏱','Termina <b>'+Math.abs(A.deltaProm)+' min antes</b> de lo cotizado en promedio — buena gestión del pabellón.']);
  if(A.conv6<25 && A.op.length>0) recs.push(['📉','Conversión de 6 meses baja (<b>'+A.conv6+'%</b> de sus solicitantes). Reforzar el seguimiento comercial de sus cotizaciones.']);
  if(A.conv6>=45 && A.op.length>=5) recs.push(['⭐','Alto valor: opera <b>'+A.op.length+' cirugías</b> con <b>'+A.conv6+'%</b> de conversión — cirujano clave para SMI.']);
  if(A.extPct>12) recs.push(['📦','Los extras son el <b>'+A.extPct+'%</b> del monto operado. Revisar si los insumos habituales deberían ir en la ficha base (menos sorpresas, mejor cotización).']);
  if(!recs.length) recs.push(['✓','Comportamiento dentro de lo esperado. Sin alertas.']);
  // score simple
  let score='Medio', cls='warn';
  if(A.op.length>=5 && A.conv6>=40){ score='Alto valor'; cls='pos'; }
  else if(A.op.length<2 || A.conv6<20){ score='A observar'; cls='neg'; }
  let h='<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px"><span class="big-num '+cls+'">'+score+'</span><span class="mp">score compuesto: volumen + conversión + eficiencia de tiempo</span></div>';
  h+=recs.map(r=>'<div class="rec"><span class="ic">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
  return h;
}

function kpiCard(lab,val,sub){ return '<div class="kpi"><div class="lab">'+lab+'</div><div class="val num">'+val+'</div><div class="sub">'+(sub||'')+'</div></div>'; }

function funnel(A){
  const op=A.pacOp, pe=A.pacPerd, ab=A.pacTot-A.pacRes, tot=A.pacTot||1;
  const seg=(n,c,txt,lab)=> n>0?'<div style="width:'+(n/tot*100).toFixed(1)+'%;background:'+c+';color:'+txt+'" title="'+lab+': '+n+'">'+n+'</div>':'';
  let h='<div class="sub" style="margin-bottom:2px">'+A.datos.length+' cotizaciones  →  <b>'+A.pacTot+' pacientes</b> distintos (RUT)</div>';
  h+='<div class="funnel">'+seg(op,'var(--fOp)','#fff','Operaron')+seg(ab,'var(--fAb)','#4a3800','Abiertos')+seg(pe,'var(--fPe)','#fff','Desistieron')+'</div>';
  h+='<div class="fleg">'
    +'<span><span class="dot" style="background:var(--fOp)"></span>Operaron <b>'+op+'</b> ('+A.op.length+' cirugías)</span>'
    +'<span><span class="dot" style="background:var(--fAb)"></span>Abiertos <b>'+ab+'</b> · aún pueden operar</span>'
    +'<span><span class="dot" style="background:var(--fPe)"></span>Desistieron <b>'+pe+'</b></span></div>';
  h+='<div class="sub" style="margin-top:9px">Conversión: <b>'+op+' de '+A.pacTot+' pacientes que cotizaron = '+A.convAll+'%</b>.'
    +(ab>0?' Hay <b>'+ab+' abiertos</b> aún en juego — al concretarse pueden subir esta conversión.':'')+'</div>';
  return h;
}

function render(nom,A){
  $('kpis').innerHTML=
    kpiCard('Pacientes',A.pacTot,'distintos (RUT)')+
    kpiCard('Cirugías operadas',A.op.length,'en '+A.pacOp+' pacientes')+
    kpiCard('Conversión',A.convAll+'%',A.pacOp+' de '+A.pacTot+' pacientes (RUT)')+
    kpiCard('Cotizaciones',A.datos.length,'folios (varios por paciente)')+
    kpiCard('Horas de pabellón',h1dec(A.hRealTot)+' h','usadas (real)')+
    kpiCard('Monto operado',clpK(A.montoOpTot),'ingreso que trae')+
    kpiCard('Extras cobradas',clpK(A.extTot),A.extPct+'% del operado');

  // Pestaña A — ojos de SMI
  let a='';
  a+='<div class="card hh"><h2>Flujo de pacientes</h2>'+funnel(A)+'</div>';
  a+='<div class="card hh"><h2>Conversión mensual</h2><div class="sub" style="margin-bottom:8px">Operados ÷ RUT que cotizaron ese mes · ▲▼ vs mes anterior · el mes en curso es provisional (aún deciden)</div>'+convRow(A)+'</div>';
  a+='<div class="card hh"><h2>Mix de cirugías</h2><div class="sub" style="margin-bottom:8px">Agrupadas por categoría (Rino, Mama, Lipo, Lifting…)</div>'+mixTable(A)+'</div>';
  a+='<div class="card hh"><h2>Eficiencia de pabellón</h2><div class="eff">'
    +'<div class="b"><div class="mp">Horas que solicita</div><div class="big-num">'+h1dec(A.hCotTot)+' h</div></div>'
    +'<div class="b"><div class="mp">Horas que usa</div><div class="big-num">'+h1dec(A.hRealTot)+' h</div></div>'
    +'<div class="b"><div class="mp">Desviación promedio</div><div class="big-num '+(A.deltaProm>0?'neg':'pos')+'">'+(A.deltaProm>0?'+':'')+A.deltaProm+' min</div></div>'
    +'<div class="b"><div class="mp">Cirugías que exceden</div><div class="big-num">'+A.nExc+' / '+A.nDur+'</div></div>'
    +'</div></div>';
  a+='<div class="card hh"><h2>Extras habituales por cirugía</h2><div class="sub" style="margin-bottom:8px">Candidatos a subir a la ficha base</div>'+extrasHab(A)+'</div>';
  a+='<div class="card hh"><h2>Valor para SMI &amp; recomendaciones</h2>'+valorRec(A)+'</div>';
  $('paneSMI').innerHTML=a;

  // Pestaña B — ojos del cirujano
  let b='';
  b+='<div class="card hh"><h2>Flujo de sus pacientes</h2>'+funnel(A)+'</div>';
  b+='<div class="card hh"><h2>Su conversión</h2><div class="sub" style="margin-bottom:8px">De los pacientes que cotizó cada mes, cuántos operaron (por RUT)</div>'+convRow(A)+'</div>';
  b+='<div class="card hh"><h2>Su gestión del tiempo de pabellón</h2><div class="eff">'
    +'<div class="b"><div class="mp">Horas que solicita</div><div class="big-num">'+h1dec(A.hCotTot)+' h</div></div>'
    +'<div class="b"><div class="mp">Horas que usa</div><div class="big-num">'+h1dec(A.hRealTot)+' h</div></div>'
    +'<div class="b"><div class="mp">En promedio</div><div class="big-num '+(A.deltaProm>0?'neg':'pos')+'">'+(A.deltaProm>0?'+':'')+A.deltaProm+' min</div></div>'
    +'</div><div class="mp" style="margin-top:8px">Cotizar el tiempo lo más real posible ayuda a que su pabellón esté disponible cuando lo necesita y evita cobros de tiempo adicional a sus pacientes.</div></div>';
  b+='<div class="card hh"><h2>Transparencia de extras</h2><div class="sub" style="margin-bottom:8px">Lo que se cobró en sus casos, por cirugía</div>'+extrasHab(A)+'</div>';
  $('paneCir').innerHTML=b;

  $('phName').textContent=nom;
  $('phMeta').innerHTML='Santiago Medical Institute · Ficha del cirujano · generada el '+fechaHoy();
  $('btnPdf').classList.remove('hidden');
}

function fechaHoy(){
  const d=new Date(), ms=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return d.getDate()+' de '+ms[d.getMonth()]+' de '+d.getFullYear();
}
$('btnPdf').onclick=()=>window.print();

document.querySelector('.tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  $('paneSMI').classList.toggle('hidden',t.dataset.t!=='smi');
  $('paneCir').classList.toggle('hidden',t.dataset.t!=='cir');
});
</script>
</body>
</html>
