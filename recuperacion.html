<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperación · SMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#CD1D52; --deep:#B22030; --bright:#E33C3B;
  --ink:#1C1719; --muted:#857479; --faint:#A99CA0;
  --bg:#FAF7F6; --card:#FFFFFF; --line:#ECE0E2; --tint:#F7F0F1;
  --pos:#1E7A4D; --neg:#C0202F; --warn:#B7791F; --info:#3B6FB3;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}

/* gate */
#gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 12px 40px -22px rgba(28,23,25,.4)}
#gate h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
#gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-family:var(--sans);font-size:15px;text-align:center;letter-spacing:.04em}
#gate input:focus{outline:none;border-color:var(--crimson)}
#gate button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--deep),var(--crimson));cursor:pointer}
#gateMsg{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
#app{display:none}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px}
.hdr h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0}
.hdr .sub{font-size:13px;color:var(--muted);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px}
.who{font-size:12px;color:var(--muted)}
.occ{display:flex;gap:8px}
.occ .chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 13px;text-align:center;min-width:90px}
.occ .chip .n{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1}
.occ .chip .n span{font-size:13px;color:var(--muted)}
.occ .chip .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.btn:hover{border-color:var(--crimson);color:var(--crimson)}

.sect-t{font-family:var(--serif);font-weight:700;font-size:18px;margin:16px 0 10px}
.sect-t span{color:var(--muted);font-weight:400;font-size:14px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 19px;cursor:pointer;position:relative}
.bed:hover{border-color:var(--crimson)}
.bed .accent{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:3px}
.bed.estable .accent{background:var(--info)} .bed.alta .accent{background:var(--pos)}
.bed.atencion .accent{background:var(--warn)} .bed.sincama .accent{background:var(--faint)}
.bed .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bed .spot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bed .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.alta{background:#E4F5EC;color:var(--pos)} .tag.atencion{background:#FBF0DA;color:var(--warn)}
.tag.estable{background:#EEF4FB;color:var(--info)} .tag.pernocta{background:#EEF4FB;color:var(--info)}
.tag.sincama{background:#F0ECED;color:var(--muted)}
.bed .pac{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.15}
.bed .folio{font-size:11px;font-weight:700;color:var(--crimson)}
.bed .meta{font-size:12px;color:var(--muted);margin-top:2px}
.bed .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mini{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--tint);color:var(--muted)}
.mini.pos{background:#E4F5EC;color:var(--pos)} .mini.warn{background:#FBF0DA;color:var(--warn)} .mini.info{background:#EEF4FB;color:var(--info)}
.empty{color:var(--muted);text-align:center;padding:26px;background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* modal detalle */
#modal{position:fixed;inset:0;background:rgba(28,23,25,.45);display:none;align-items:flex-start;justify-content:center;padding:18px;z-index:50;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:var(--card);border-radius:18px;max-width:560px;width:100%;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);margin:auto}
.m-head{background:linear-gradient(120deg,var(--deep),var(--crimson));color:#fff;padding:16px 20px;position:relative}
.m-head .folio{font-size:12px;font-weight:700;opacity:.9}
.m-head .pac{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.1;margin-top:2px}
.m-head .cx{font-size:12.5px;opacity:.92;margin-top:3px}
.m-close{position:absolute;top:14px;right:16px;color:#fff;font-size:22px;cursor:pointer;opacity:.85;line-height:1}
.m-body{padding:16px 20px;max-height:66vh;overflow-y:auto}
.sec{margin-bottom:16px}
.sec .st{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv .k{color:var(--muted)} .kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.team{font-size:11.5px;background:var(--tint);border-radius:7px;padding:4px 9px;display:inline-block;margin:0 5px 5px 0}
.team b{color:var(--ink)}
.vit-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.vit-tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:9.5px;text-transform:uppercase;padding:4px 5px;border-bottom:1px solid var(--line)}
.vit-tbl td{padding:5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ald-badge{display:inline-block;font-family:var(--serif);font-size:15px;font-weight:700;padding:1px 9px;border-radius:20px}
.ald-ok{background:#E4F5EC;color:var(--pos)} .ald-no{background:#FBF0DA;color:var(--warn)}
.aldrete{background:#F7F0F1;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.ald-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ald-score{font-family:var(--serif);font-size:28px;font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--sans);font-size:13px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--crimson)}
.ex-line{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ex-tot{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:6px}
.act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.act{flex:1;min-width:130px;border:0;border-radius:10px;padding:11px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.act.control{background:var(--tint);color:var(--crimson);border:1px solid var(--line)}
.act.extra{background:#EEF4FB;color:var(--info);border:1px solid #CFE0F2}
.act.alta{background:linear-gradient(120deg,#166b41,var(--pos));color:#fff}
.act.alta.dis{background:var(--tint);color:var(--muted);cursor:default}
.subform{background:#FBFAFA;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px}
.subform h4{margin:0 0 9px;font-family:var(--serif);font-size:16px}
.subform .go{margin-top:10px;width:100%;border:0;border-radius:9px;padding:11px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--deep),var(--crimson));cursor:pointer}
.msg{font-size:12px;margin-top:8px;min-height:16px}
.hidden{display:none}
.foot{margin-top:24px;text-align:center;color:var(--faint);font-size:12px}
</style>
</head>
<body>

<div id="gate">
  <h2>Recuperación</h2>
  <p>Unidad de Recuperación · Ingrese su clave</p>
  <input type="password" id="clave" placeholder="Clave" autocomplete="off">
  <button id="entrar">Ingresar</button>
  <div id="gateMsg"></div>
</div>

<div id="app" class="wrap">
  <div class="hdr">
    <div>
      <h1>Recuperación</h1>
      <div class="sub">Santiago Medical Institute · Unidad de Recuperación Post-Anestésica</div>
    </div>
    <div class="hdr-right">
      <span class="who" id="whoTxt"></span>
      <div class="occ">
        <div class="chip"><div class="n" id="occCamas">0<span>/6</span></div><div class="l">Camas</div></div>
        <div class="chip"><div class="n" id="occHabs">0<span>/3</span></div><div class="l">Habitaciones</div></div>
      </div>
      <button class="btn" onclick="cargar()">↻ Actualizar</button>
    </div>
  </div>

  <div id="porAsignar"></div>
  <div class="sect-t">En recuperación ahora <span id="nPac"></span></div>
  <div class="board" id="board"></div>

  <div class="foot">Recuperación · SMI · Controles cada 1 hora · Alta con Aldrete ≥ 9</div>
</div>

<div id="modal" onclick="if(event.target===this)cerrar()">
  <div class="mbox" id="mbox"></div>
</div>

<script>
const SUPA_URL='https://rhpguniznuhljiigwetq.supabase.co';
const SUPA_KEY='sb_publishable_lVaI9a2wWFa0PSL3edPiRA_cVMlXDwG';
const $=id=>document.getElementById(id);
let CLAVE='', SESION='', CASOS=[], SEL=null;
const CAMAS=['Cama 1','Cama 2','Cama 3','Cama 4','Cama 5','Cama 6'];
const HABS=['Habitación 1','Habitación 2','Habitación 3'];

const clp=n=>'$'+Math.round(+n||0).toLocaleString('es-CL');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=t=>t?new Date(t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
function transcurrido(t){ if(!t) return ''; const m=Math.round((Date.now()-new Date(t))/60000); if(m<60) return m+'m'; return Math.floor(m/60)+'h '+(m%60)+'m'; }
function minsDesde(t){ return t?Math.round((Date.now()-new Date(t))/60000):null; }

async function rpc(fn,body){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

$('entrar').onclick=entrar;
$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
async function entrar(){
  const c=$('clave').value.trim(); if(!c) return;
  $('gateMsg').textContent='Verificando…';
  try{
    const u=await rpc('smi_login',{p_clave:c});
    const usr=Array.isArray(u)?u[0]:u;
    if(!usr || !(usr.puede_recuperacion || usr.puede_director)){ $('gateMsg').textContent='Su clave no tiene acceso a este panel.'; return; }
    CLAVE=c; SESION=usr.nombre;
    $('whoTxt').textContent=SESION;
    $('gate').style.display='none'; $('app').style.display='block';
    await cargar();
  }catch(e){ $('gateMsg').textContent='Error de conexión.'; }
}

async function cargar(){
  try{ CASOS=await rpc('smi_recu_tablero',{p_clave:CLAVE}); CASOS=Array.isArray(CASOS)?CASOS:[]; }
  catch(e){ CASOS=[]; }
  render();
  if(SEL){ const c=CASOS.find(x=>x.id===SEL); if(c) abrir(SEL); else cerrar(); }
}

function estadoCard(c){
  const ald=c.ultimo_aldrete;
  if(!c.cama) return {cls:'sincama', tag:'sincama', txt:'Sin cama asignada'};
  if(ald!=null && ald>=9) return {cls:'alta', tag:'alta', txt:'Alta ✓ Aldrete '+ald};
  const md=minsDesde(c.ultimo_control);
  if(md==null) return {cls:'atencion', tag:'atencion', txt:'Sin controles'};
  if(md>=60) return {cls:'atencion', tag:'atencion', txt:'Control atrasado'};
  return {cls:'estable', tag:'estable', txt:'Estable'+(ald!=null?' · Aldrete '+ald:'')};
}

function render(){
  const conCama=CASOS.filter(c=>c.cama), sinCama=CASOS.filter(c=>!c.cama);
  // ocupación
  let nc=0, nh=0;
  conCama.forEach(c=>{ if((c.cama||'').toLowerCase().startsWith('hab')) nh++; else nc++; });
  $('occCamas').innerHTML=nc+'<span>/6</span>'; $('occHabs').innerHTML=nh+'<span>/3</span>';
  $('nPac').textContent='· '+CASOS.length+' paciente'+(CASOS.length!==1?'s':'');

  // por asignar
  if(sinCama.length){
    let h='<div class="sect-t" style="color:var(--warn)">Por asignar cama <span>· '+sinCama.length+'</span></div><div class="board">';
    sinCama.forEach(c=>h+=card(c));
    h+='</div>';
    $('porAsignar').innerHTML=h;
  } else $('porAsignar').innerHTML='';

  // tablero
  if(!conCama.length && !sinCama.length){ $('board').innerHTML='<div class="empty">No hay pacientes en recuperación en este momento.</div>'; return; }
  $('board').innerHTML=conCama.map(card).join('') || '<div class="empty">Todos los pacientes están por asignar cama.</div>';
}

function card(c){
  const st=estadoCard(c);
  const pernocta=c.hospitalizacion;
  return '<div class="bed '+st.cls+'" onclick="abrir(\''+c.id+'\')">'
    +'<div class="accent"></div>'
    +'<div class="top"><span class="spot">'+(c.cama?esc(c.cama):'— sin ubicar —')+'</span>'
    +'<span class="tag '+st.tag+'">'+st.txt+'</span></div>'
    +'<div class="pac">'+esc(c.paciente||'—')+'</div>'
    +'<div class="folio">'+esc(c.folio||'')+(pernocta?' · <span style="color:var(--info)">día cama</span>':'')+'</div>'
    +'<div class="meta">'+esc(c.cirugia||'')+' · '+esc(c.cirujano||'')+'</div>'
    +'<div class="meta">ingresó '+hhmm(c.hora_ingreso_recu)+' · '+transcurrido(c.hora_ingreso_recu)+' en recu</div>'
    +'<div class="foot">'
    + (c.extras_total>0?'<span class="mini info">extras '+clp(c.extras_total)+'</span>':'')
    + (c.extras_pendientes>0?'<span class="mini warn">'+c.extras_pendientes+' x validar</span>':'')
    + (c.ultimo_control?'<span class="mini">últ. control '+hhmm(c.ultimo_control)+'</span>':'')
    +'</div></div>';
}

/* ── detalle ── */
function abrir(id){
  SEL=id;
  const c=CASOS.find(x=>x.id===id); if(!c) return;
  const ald=c.ultimo_aldrete;
  const puedeAlta = ald!=null && ald>=9;
  let h='<div class="m-head"><span class="m-close" onclick="cerrar()">×</span>'
    +'<div class="folio">'+esc(c.folio||'')+(c.cama?' · '+esc(c.cama):' · sin cama')+'</div>'
    +'<div class="pac">'+esc(c.paciente||'—')+'</div>'
    +'<div class="cx">'+esc(c.cirugia||'')+' · '+esc(c.cirujano||'')+'</div></div>';
  h+='<div class="m-body">';

  // asignar cama si no tiene
  if(!c.cama){
    const ocup=CASOS.filter(x=>x.cama).map(x=>x.cama);
    const libres=[...CAMAS,...HABS].filter(x=>!ocup.includes(x));
    h+='<div class="subform"><h4>Asignar cama / habitación</h4>'
      +'<div class="fld"><select id="camaSel">'+libres.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'
      +'<button class="go" onclick="asignarCama(\''+c.id+'\')">Asignar e ingresar a recuperación</button>'
      +'<div class="msg" id="msgCama"></div></div>';
  }

  // desde pabellón
  h+='<div class="sec"><div class="st">🏥 Desde pabellón</div>'
    +'<div class="kv"><span class="k">Ingreso a recuperación</span><span class="v">'+hhmm(c.hora_ingreso_recu)+'</span></div>'
    +'<div class="kv"><span class="k">Tiempo quirúrgico</span><span class="v">'+hhmm(c.hora_inicio_real)+' – '+hhmm(c.hora_fin_real)+(c.duracion_real_min?' · '+c.duracion_real_min+' min':'')+'</span></div>'
    +(c.hora_incision?'<div class="kv"><span class="k">Incisión</span><span class="v">'+hhmm(c.hora_incision)+'</span></div>':'')
    +'<div class="kv"><span class="k">Pabellón</span><span class="v">Pab '+(c.pabellon||'—')+'</span></div></div>';

  // equipo
  if((c.equipo||[]).length){
    h+='<div class="sec"><div class="st">👥 Equipo que atendió</div>';
    c.equipo.forEach(e=>h+='<span class="team">'+esc(e.rol||'')+' · <b>'+esc(e.nombre||'')+'</b></span>');
    h+='</div>';
  }

  // signos vitales
  h+='<div class="sec"><div class="st">📋 Signos vitales · cada 1 hora</div>';
  if((c.vitales||[]).length){
    h+='<table class="vit-tbl"><tr><th>Hora</th><th>PA</th><th>FC</th><th>SatO₂</th><th>T°</th><th>EVA</th><th>Aldrete</th></tr>';
    c.vitales.forEach(v=>{
      h+='<tr><td>'+hhmm(v.hora)+'</td><td>'+(v.pa_sist||'')+'/'+(v.pa_diast||'')+'</td><td>'+(v.fc||'')+'</td><td>'+(v.sato2!=null?v.sato2+'%':'')+'</td><td>'+(v.temp||'')+'</td><td>'+(v.dolor_eva!=null?v.dolor_eva:'')+'</td>'
        +'<td><span class="ald-badge '+((v.aldrete!=null&&v.aldrete>=9)?'ald-ok':'ald-no')+'">'+(v.aldrete!=null?v.aldrete:'—')+'</span></td></tr>';
    });
    h+='</table>';
  } else h+='<div style="font-size:12px;color:var(--muted)">Aún sin controles registrados.</div>';
  h+='</div>';

  // extras
  h+='<div class="sec"><div class="st">💰 Extras (abierto hasta el alta)</div>'
    +'<div class="ex-tot"><span>Extras acumulados</span><span>'+clp(c.extras_total)+'</span></div>'
    +(c.extras_pendientes>0?'<div style="font-size:11px;color:var(--warn);margin-top:3px">'+c.extras_pendientes+' extra(s) por validar</div>':'')
    +'</div>';

  // subformularios (ocultos)
  h+='<div class="subform hidden" id="formControl"><h4>Registrar control</h4>'
    +'<div class="form-grid">'
    +fld('PA sistólica','ctPaS','number')+fld('PA diastólica','ctPaD','number')
    +fld('FC','ctFc','number')+fld('SatO₂ %','ctSat','number')
    +fld('T° (°C)','ctTemp','number')+fld('Dolor EVA (0-10)','ctEva','number')
    +'</div>'
    +'<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:12px 0 6px">Escala de Aldrete (0-2 c/u)</div>'
    +'<div class="form-grid">'
    +aldFld('Actividad','ctAct')+aldFld('Respiración','ctResp')
    +aldFld('Circulación','ctCirc')+aldFld('Conciencia','ctConc')
    +aldFld('Saturación O₂','ctSatO')+'<div></div>'
    +'</div>'
    +'<button class="go" onclick="guardarControl(\''+c.id+'\')">Guardar control</button>'
    +'<div class="msg" id="msgControl"></div></div>';

  h+='<div class="subform hidden" id="formExtra"><h4>Agregar extra</h4>'
    +'<div class="fld"><label>Descripción</label><input id="exDesc" placeholder="Ej: Analgesia EV · Ketoprofeno"></div>'
    +'<div class="form-grid" style="margin-top:8px">'
    +fld('Cantidad','exCant','number','1')+fld('Precio unitario','exPrec','number')+'</div>'
    +'<button class="go" onclick="guardarExtra(\''+c.id+'\')">Agregar a la cuenta</button>'
    +'<div class="msg" id="msgExtra"></div></div>';

  // Aldrete resumen + acciones
  h+='<div class="sec"><div class="st">✅ Criterio de alta (Aldrete)</div>'
    +'<div class="aldrete"><div class="ald-top"><span style="font-size:12px;color:var(--muted);font-weight:600">Último puntaje</span>'
    +'<span class="ald-score" style="color:'+(puedeAlta?'var(--pos)':'var(--warn)')+'">'+(ald!=null?ald:'—')+'<span style="font-size:14px;color:var(--muted)">/10</span></span></div>'
    +'<div style="font-size:11.5px;color:'+(puedeAlta?'var(--pos)':'var(--warn)')+';font-weight:600">'+(puedeAlta?'Cumple criterio de alta (≥9).':'Aún en observación — alta recomendada con ≥9.')+'</div></div></div>';

  h+='<div class="act-row">'
    +'<button class="act control" onclick="toggle(\'formControl\')">🩺 Registrar control</button>'
    +'<button class="act extra" onclick="toggle(\'formExtra\')">＋ Agregar extra</button>'
    +'</div><div class="act-row">'
    +'<button class="act alta'+(puedeAlta?'':' dis')+'" onclick="darAlta(\''+c.id+'\','+(!puedeAlta)+')">'+(puedeAlta?'✓ Dar de alta':'Aún no cumple alta')+'</button>'
    +'</div><div class="msg" id="msgAlta"></div>';

  h+='</div>';
  $('mbox').innerHTML=h;
  $('modal').classList.add('on');
}
function cerrar(){ SEL=null; $('modal').classList.remove('on'); }
function toggle(id){ const e=$(id); if(e) e.classList.toggle('hidden'); }
function fld(label,id,type,val){ return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'"'+(val?' value="'+val+'"':'')+'></div>'; }
function aldFld(label,id){ return '<div class="fld"><label>'+label+'</label><select id="'+id+'"><option value="2">2</option><option value="1">1</option><option value="0">0</option></select></div>'; }
const val=id=>{ const e=$(id); return e&&e.value!==''?+e.value:null; };

async function asignarCama(id){
  const cama=$('camaSel').value;
  try{ await rpc('smi_recu_asignar_cama',{p_clave:CLAVE,p_caso_id:id,p_cama:cama}); await cargar(); }
  catch(e){ $('msgCama').textContent='Error: '+e.message; $('msgCama').style.color='var(--neg)'; }
}
async function guardarControl(id){
  const b={p_clave:CLAVE,p_caso_id:id,
    p_pa_sist:val('ctPaS'),p_pa_diast:val('ctPaD'),p_fc:val('ctFc'),p_sato2:val('ctSat'),
    p_temp:val('ctTemp'),p_dolor:val('ctEva'),
    p_ald_act:val('ctAct'),p_ald_resp:val('ctResp'),p_ald_circ:val('ctCirc'),
    p_ald_conc:val('ctConc'),p_ald_sat:val('ctSatO')};
  try{ const r=await rpc('smi_recu_control',b); $('msgControl').textContent='Control guardado · Aldrete '+r.aldrete; $('msgControl').style.color='var(--pos)'; setTimeout(cargar,700); }
  catch(e){ $('msgControl').textContent='Error: '+e.message; $('msgControl').style.color='var(--neg)'; }
}
async function guardarExtra(id){
  const desc=$('exDesc').value.trim(); if(!desc){ $('msgExtra').textContent='Indique la descripción.'; $('msgExtra').style.color='var(--neg)'; return; }
  try{ await rpc('smi_agregar_extra',{p_clave:CLAVE,p_caso_id:id,p_tipo:'servicio',p_descripcion:desc,p_cantidad:val('exCant')||1,p_precio_unitario:val('exPrec')||0});
    $('msgExtra').textContent='Extra agregado.'; $('msgExtra').style.color='var(--pos)'; setTimeout(cargar,700); }
  catch(e){ $('msgExtra').textContent='Error: '+e.message; $('msgExtra').style.color='var(--neg)'; }
}
async function darAlta(id, requiereForzar){
  const c=CASOS.find(x=>x.id===id)||{};
  if(requiereForzar){
    if(!confirm('Aldrete '+(c.ultimo_aldrete!=null?c.ultimo_aldrete:'—')+'/10 — aún no cumple el criterio de alta (≥9).\n\n¿Dar de alta igualmente, con indicación médica?')) return;
  } else {
    if(!confirm('¿Dar de alta a '+(c.paciente||'')+'? El caso se cierra y libera la cama.')) return;
  }
  try{ await rpc('smi_recu_alta',{p_clave:CLAVE,p_caso_id:id,p_forzar:!!requiereForzar}); cerrar(); await cargar(); }
  catch(e){ $('msgAlta').textContent='Error: '+e.message; $('msgAlta').style.color='var(--neg)'; }
}
</script>
</body>
</html>
