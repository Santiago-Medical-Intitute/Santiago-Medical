<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega · SMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#CD1D52; --deep:#B22030; --bright:#E33C3B;
  --ink:#1C1719; --muted:#857479; --faint:#A99CA0;
  --bg:#FAF7F6; --card:#FFFFFF; --line:#ECE0E2; --tint:#F7F0F1;
  --pos:#1E7A4D; --neg:#C0202F; --warn:#B7791F; --info:#3B6FB3;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
#gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 12px 40px -22px rgba(28,23,25,.4)}
#gate h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
#gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-family:var(--sans);font-size:15px;text-align:center;letter-spacing:.04em}
#gate input:focus{outline:none;border-color:var(--crimson)}
#gate button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--deep),var(--crimson));cursor:pointer}
#gateMsg{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
#app{display:none}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px}
.hdr h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0}
.hdr .sub{font-size:13px;color:var(--muted);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.btn:hover{border-color:var(--crimson);color:var(--crimson)}
.btn.primary{background:linear-gradient(120deg,var(--deep),var(--crimson));color:#fff;border:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .n{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:3px}
.kpi.crit{border-color:#F2C7CF} .kpi.crit .n{color:var(--neg)}
.kpi.baj .n{color:var(--warn)}
.upd{font-size:12px;color:var(--muted);margin:2px 0 18px}
.sect-t{font-family:var(--serif);font-weight:700;font-size:19px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sect-t .c{font-size:13px;color:#fff;background:var(--neg);border-radius:20px;padding:1px 9px;font-family:var(--sans);font-weight:700}
.sect-t.baj .c{background:var(--warn)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 15px 11px 18px;margin-bottom:8px;position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row .accent{position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px}
.row.critico .accent{background:var(--neg)} .row.bajo .accent{background:var(--warn)}
.row .nm{font-weight:600;font-size:14px}
.row .meta{font-size:12px;color:var(--muted);margin-top:1px}
.row .prov{font-size:11.5px;color:var(--info);font-weight:600}
.row .qty{text-align:right;white-space:nowrap}
.row .qty .big{font-family:var(--serif);font-size:22px;font-weight:700}
.row .qty .big.neg{color:var(--neg)} .row .qty .big.warn{color:var(--warn)}
.row .qty .min{font-size:11px;color:var(--muted)}
.badge-nm{font-size:9.5px;font-weight:700;color:var(--warn);background:#FBF0DA;border-radius:20px;padding:1px 7px;margin-left:6px;text-transform:uppercase}
.tools{display:flex;gap:10px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--sans);font-size:13px}
.tools input:focus{outline:none;border-color:var(--crimson)}
table.inv{width:100%;border-collapse:collapse;font-size:12.5px}
table.inv th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:7px 8px;border-bottom:1px solid var(--line)}
table.inv td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.inv tr:hover td{background:var(--tint)}
.st-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.st-critico{background:#FBE0E5;color:var(--neg)} .st-bajo{background:#FBF0DA;color:var(--warn)} .st-ok{background:#E9EEE9;color:var(--pos)}
.empty{color:var(--muted);text-align:center;padding:34px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.foot{margin-top:26px;text-align:center;color:var(--faint);font-size:12px}
</style>
</head>
<body>

<div id="gate">
  <h2>Bodega</h2>
  <p>Operaciones · Ingrese su clave</p>
  <input type="password" id="clave" placeholder="Clave" autocomplete="off">
  <button id="entrar">Ingresar</button>
  <div id="gateMsg"></div>
</div>

<div id="app" class="wrap">
  <div class="hdr">
    <div>
      <h1>Bodega · Stock</h1>
      <div class="sub">Santiago Medical Institute · Control de inventario y alertas</div>
    </div>
    <div class="hdr-right">
      <span class="who" id="whoTxt"></span>
      <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none" onchange="subirCsv(this)">
      <button class="btn primary" onclick="document.getElementById('csvFile').click()">↑ Actualizar stock (CSV)</button>
      <button class="btn" onclick="cargar()">↻ Recargar</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="upd" id="upd"></div>
  <div id="secCrit"></div>
  <div id="secBajo"></div>

  <div class="sect-t">Inventario completo</div>
  <div class="tools"><input type="text" id="buscar" placeholder="Buscar producto o proveedor…" oninput="renderTabla()"></div>
  <div id="tabla"></div>

  <div class="foot">Bodega · SMI · Sube el CSV de inventario de Medilink para refrescar · Crítico = stock ≤ mínimo</div>
</div>

<script>
const SUPA_URL='https://rhpguniznuhljiigwetq.supabase.co';
const SUPA_KEY='sb_publishable_lVaI9a2wWFa0PSL3edPiRA_cVMlXDwG';
const $=id=>document.getElementById(id);
let CLAVE='', SESION='', ITEMS=[], ACTUALIZADO=null;

const clp=n=>'$'+Math.round(+n||0).toLocaleString('es-CL');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdt=t=>t?new Date(t).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';

async function rpc(fn,body){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

$('entrar').onclick=entrar;
$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
async function entrar(){
  const c=$('clave').value.trim(); if(!c) return;
  $('gateMsg').textContent='Verificando…';
  try{
    const u=await rpc('smi_login',{p_clave:c});
    const usr=Array.isArray(u)?u[0]:u;
    if(!usr || !(usr.puede_operaciones || usr.puede_director)){ $('gateMsg').textContent='Su clave no tiene acceso a este panel.'; return; }
    CLAVE=c; SESION=usr.nombre; $('whoTxt').textContent=SESION;
    $('gate').style.display='none'; $('app').style.display='block';
    await cargar();
  }catch(e){ $('gateMsg').textContent='Error de conexión.'; }
}

async function cargar(){
  try{ const d=await rpc('smi_stock_tablero',{p_clave:CLAVE}); ITEMS=(d&&d.items)||[]; ACTUALIZADO=d&&d.actualizado; }
  catch(e){ ITEMS=[]; ACTUALIZADO=null; }
  render();
}

function render(){
  const crit=ITEMS.filter(i=>i.estado==='critico');
  const baj=ITEMS.filter(i=>i.estado==='bajo');
  const sinMap=ITEMS.filter(i=>!i.mapeado).length;
  $('kpis').innerHTML=
    '<div class="kpi crit"><div class="n">'+crit.length+'</div><div class="l">Stock crítico</div></div>'
    +'<div class="kpi baj"><div class="n">'+baj.length+'</div><div class="l">Stock bajo</div></div>'
    +'<div class="kpi"><div class="n">'+ITEMS.length+'</div><div class="l">Productos</div></div>'
    +'<div class="kpi"><div class="n">'+sinMap+'</div><div class="l">Sin mapear</div></div>';
  $('upd').innerHTML = ACTUALIZADO ? ('Stock actualizado al <b>'+fdt(ACTUALIZADO)+'</b>') : 'Aún no hay stock cargado — sube el CSV de Medilink.';

  $('secCrit').innerHTML = crit.length ? '<div class="sect-t">🔴 Stock crítico <span class="c">'+crit.length+'</span></div>'+crit.map(fila).join('') : '';
  $('secBajo').innerHTML = baj.length ? '<div class="sect-t baj">🟠 Stock bajo <span class="c">'+baj.length+'</span></div>'+baj.map(fila).join('') : '';
  renderTabla();
}

function fila(i){
  const falta = (i.stock_seguridad!=null) ? Math.max(0, (+i.stock_seguridad) - (+i.cantidad) + 1) : 0;
  const cls = i.estado==='critico'?'critico':'bajo';
  const qcls = i.estado==='critico'?'neg':'warn';
  return '<div class="row '+cls+'"><div class="accent"></div>'
    +'<div><div class="nm">'+esc(i.nombre)+(!i.mapeado?'<span class="badge-nm">sin mapear</span>':'')+'</div>'
    +'<div class="meta">'+esc(i.producto)+'</div>'
    +(i.proveedor&&i.proveedor!=='-'?'<div class="prov">Proveedor: '+esc(i.proveedor)+'</div>':'<div class="prov" style="color:var(--faint)">sin proveedor registrado</div>')+'</div>'
    +'<div class="qty"><div class="big '+qcls+'">'+(+i.cantidad)+'</div><div class="min">mínimo '+(i.stock_seguridad!=null?+i.stock_seguridad:'—')+(falta>0?' · faltan '+falta:'')+'</div></div></div>';
}

function renderTabla(){
  const q=($('buscar').value||'').trim().toLowerCase();
  let list=ITEMS;
  if(q) list=ITEMS.filter(i=>(i.nombre||'').toLowerCase().includes(q)||(i.producto||'').toLowerCase().includes(q)||(i.proveedor||'').toLowerCase().includes(q));
  if(!ITEMS.length){ $('tabla').innerHTML='<div class="empty">No hay stock cargado. Usa <b>↑ Actualizar stock (CSV)</b> para subir el inventario de Medilink.</div>'; return; }
  let h='<table class="inv"><tr><th>Producto</th><th>Proveedor</th><th style="text-align:right">Stock</th><th style="text-align:right">Mínimo</th><th>Estado</th></tr>';
  list.slice(0,600).forEach(i=>{
    const b=i.estado==='critico'?'st-critico':(i.estado==='bajo'?'st-bajo':'st-ok');
    const et=i.estado==='critico'?'Crítico':(i.estado==='bajo'?'Bajo':'OK');
    h+='<tr><td>'+esc(i.nombre)+(!i.mapeado?' <span class="badge-nm">sin mapear</span>':'')+'</td>'
      +'<td style="color:var(--muted)">'+esc(i.proveedor&&i.proveedor!=='-'?i.proveedor:'—')+'</td>'
      +'<td style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">'+(+i.cantidad)+'</td>'
      +'<td style="text-align:right;color:var(--muted);font-variant-numeric:tabular-nums">'+(i.stock_seguridad!=null?+i.stock_seguridad:'—')+'</td>'
      +'<td><span class="st-badge '+b+'">'+et+'</span></td></tr>';
  });
  h+='</table>';
  if(list.length>600) h+='<div style="font-size:11px;color:var(--muted);margin-top:6px">Mostrando 600 de '+list.length+' — usa el buscador para filtrar.</div>';
  $('tabla').innerHTML=h;
}

/* ───── CSV ───── */
function detectarDelim(linea){
  const cont=d=>(linea.split(d).length-1);
  const c=cont(','), pc=cont(';'), t=cont('\t');
  if(pc>=c && pc>=t) return ';'; if(t>c) return '\t'; return ',';
}
function parseLinea(linea, delim){
  const out=[]; let cur='', q=false;
  for(let k=0;k<linea.length;k++){ const ch=linea[k];
    if(q){ if(ch==='"'){ if(linea[k+1]==='"'){cur+='"';k++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===delim){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur); return out;
}
const numLimpio=s=>{ if(s==null) return ''; const t=String(s).replace(/[^0-9-]/g,''); return t; };
function fechaISO(s){ if(!s) return ''; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return ''; }

function mapearCol(headers){
  const idx={}; headers.forEach((h,i)=>{ const t=(h||'').toLowerCase();
    if(t.includes('producto')) idx.producto=i;
    else if(t.includes('cantidad')) idx.cantidad=i;
    else if(t.includes('seguridad')||t.includes('mínimo')||t.includes('minimo')) idx.stock_seguridad=i;
    else if(t.includes('costo unitario')) idx.costo_unitario=i;
    else if(t.includes('precio')) idx.precio_venta=i;
    else if(t.includes('costo promedio')||t.includes('promedio')) idx.costo_promedio=i;
    else if(t.includes('proveedor')) idx.proveedor=i;
    else if(t.includes('fecha')) idx.fecha_ingreso=i;
    else if(t.includes('sucursal')) idx.sucursal=i;
  }); return idx;
}

async function subirCsv(input){
  const file=input.files&&input.files[0]; if(!file) return;
  try{
    const txt=await file.text();
    const lineas=txt.split(/\r?\n/).filter(l=>l.trim()!=='');
    // encontrar la fila de cabecera (la que contiene "Producto")
    let hi=lineas.findIndex(l=>/producto/i.test(l) && /cantidad/i.test(l));
    if(hi<0){ alert('No encontré la fila de cabeceras (con "Producto" y "Cantidad"). ¿Es el CSV de inventario de Medilink?'); input.value=''; return; }
    const delim=detectarDelim(lineas[hi]);
    const headers=parseLinea(lineas[hi],delim);
    const idx=mapearCol(headers);
    if(idx.producto==null || idx.cantidad==null){ alert('El CSV no tiene columnas Producto/Cantidad reconocibles.'); input.value=''; return; }
    const filas=[];
    for(let r=hi+1;r<lineas.length;r++){
      const c=parseLinea(lineas[r],delim);
      const prod=(c[idx.producto]||'').trim(); if(!prod) continue;
      filas.push({
        producto:prod,
        cantidad:numLimpio(c[idx.cantidad]),
        stock_seguridad:idx.stock_seguridad!=null?numLimpio(c[idx.stock_seguridad]):'',
        costo_unitario:idx.costo_unitario!=null?numLimpio(c[idx.costo_unitario]):'',
        precio_venta:idx.precio_venta!=null?numLimpio(c[idx.precio_venta]):'',
        costo_promedio:idx.costo_promedio!=null?numLimpio(c[idx.costo_promedio]):'',
        proveedor:idx.proveedor!=null?(c[idx.proveedor]||'').trim():'',
        fecha_ingreso:idx.fecha_ingreso!=null?fechaISO(c[idx.fecha_ingreso]):'',
        sucursal:idx.sucursal!=null?(c[idx.sucursal]||'').trim():''
      });
    }
    if(!filas.length){ alert('No se leyeron filas de datos.'); input.value=''; return; }
    if(!confirm('Se van a cargar '+filas.length+' productos y reemplazar el stock actual. ¿Continuar?')){ input.value=''; return; }
    const res=await rpc('smi_stock_reemplazar',{p_clave:CLAVE,p_filas:filas});
    alert('✓ Stock actualizado: '+((res&&res.filas)||filas.length)+' productos.');
    input.value='';
    await cargar();
  }catch(e){ alert('Error al procesar el CSV: '+e.message); input.value=''; }
}
</script>
</body>
</html>
