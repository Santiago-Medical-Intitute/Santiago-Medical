<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega de Pabellón · SMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#CD1D52; --bright:#E33C3B; --deep:#B22030;
  --ink:#1C1719; --muted:#857479; --faint:#A99CA0;
  --bg:#FAF7F6; --card:#FFFFFF; --line:#ECE0E2; --tint:#F7F0F1;
  --grad:linear-gradient(120deg,var(--deep),var(--crimson) 55%,var(--bright));
  --pos:#1E7A4D; --neg:#C0202F; --warn:#B7791F; --info:#3B6FB3;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}

#gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 12px 40px -22px rgba(28,23,25,.4)}
#gate h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
#gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-family:var(--sans);font-size:15px;text-align:center;letter-spacing:.04em}
#gate input:focus{outline:none;border-color:var(--crimson)}
#gate button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;color:#fff;background:var(--grad);cursor:pointer}
#gateMsg{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}

#app{display:none;flex-direction:column;height:100vh}
.top{border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.top-in{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.top-row h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0}
.top-row .sub{font-size:12.5px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:12px}
.who-txt{font-size:12px;color:var(--muted)}
.mini-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.mini-btn:hover{border-color:var(--crimson);color:var(--crimson)}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:11px 18px 12px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--crimson);border-bottom-color:var(--crimson)}
.frames{flex:1 1 auto;position:relative;overflow:hidden}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.frames iframe.active{display:block}
.floading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
@media(max-width:600px){.tab{padding:10px 12px 11px;font-size:13px} .top-row h1{font-size:20px}}
</style>
</head>
<body>

<div id="gate">
  <h2>Bodega de Pabellón</h2>
  <p>Preparación y entrega de insumos · Ingrese su clave</p>
  <input type="password" id="clave" placeholder="Clave" autocomplete="off">
  <button id="entrar">Ingresar</button>
  <div id="gateMsg"></div>
</div>

<div id="app">
  <div class="top">
    <div class="top-in">
      <div class="top-row">
        <div>
          <h1>Bodega de Pabellón</h1>
          <div class="sub">Preparación y entrega de insumos · Santiago Medical Institute</div>
        </div>
        <div class="top-right">
          <span class="who-txt" id="whoTxt"></span>
          <button class="mini-btn" onclick="recargarActiva()">↻ Actualizar</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="entregas" onclick="activar('entregas')">Entregas</button>
        <button class="tab"        data-tab="ficha"    onclick="activar('ficha')">Ficha de Insumos</button>
        <button class="tab"        data-tab="bodega"   onclick="activar('bodega')">Bodega · Stock</button>
      </div>
    </div>
  </div>
  <div class="frames" id="frames">
    <div class="floading" id="floading">Cargando…</div>
    <iframe id="fr-entregas" data-src="entregas.html"></iframe>
    <iframe id="fr-ficha"    data-src="ficha-insumos.html"></iframe>
    <iframe id="fr-bodega"   data-src="bodega.html"></iframe>
  </div>
</div>

<script>
const SUPA_URL='https://rhpguniznuhljiigwetq.supabase.co';
const SUPA_KEY='sb_publishable_lVaI9a2wWFa0PSL3edPiRA_cVMlXDwG';
const $=id=>document.getElementById(id);
let CLAVE='', SESION='';

async function rpc(fn,body){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ── LOGIN (una sola vez; se pasa a cada pestaña) ── */
$('entrar').onclick=entrar;
$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
async function entrar(){
  const c=$('clave').value.trim(); if(!c) return;
  $('gateMsg').textContent='Verificando…';
  try{
    const u=await rpc('smi_login_bodega',{p_clave:c});
    const usr=Array.isArray(u)?u[0]:u;
    if(!usr || !usr.nombre){ $('gateMsg').textContent='Esa clave no tiene acceso a la Bodega de Pabellón.'; return; }
    CLAVE=c; SESION=usr.nombre;
    $('whoTxt').textContent=SESION;
    $('gate').style.display='none'; $('app').style.display='flex';
    activar('entregas');
  }catch(e){ $('gateMsg').textContent='Error de conexión.'; }
}

/* ── PESTAÑAS + auto-login del iframe ── */
const IFRAMES={entregas:'fr-entregas', ficha:'fr-ficha', bodega:'fr-bodega'};
let TAB_ACTUAL='';

function activar(tab){
  TAB_ACTUAL=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  Object.entries(IFRAMES).forEach(([k,id])=>{
    const fr=$(id);
    fr.classList.toggle('active', k===tab);
    if(k===tab) cargarFrame(fr);
  });
}

function cargarFrame(fr){
  if(fr.dataset.loaded) return;
  fr.dataset.loaded='1';
  $('floading').style.display='flex';
  fr.addEventListener('load',()=>{ autologin(fr); $('floading').style.display='none'; }, {once:true});
  fr.src=fr.dataset.src;
}

function autologin(fr){
  try{
    const win=fr.contentWindow, doc=fr.contentDocument;
    if(!doc) return;
    const inp=doc.getElementById('clave');
    if(inp) inp.value=CLAVE;
    if(typeof win.entrar==='function') win.entrar();
  }catch(e){ /* fallback: gate del iframe */ }
}

function recargarActiva(){
  const fr=$(IFRAMES[TAB_ACTUAL]); if(!fr) return;
  fr.dataset.loaded='';
  cargarFrame(fr);
}
</script>
</body>
</html>
